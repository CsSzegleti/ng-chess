<div class="grid">
  @for (tile of board.tiles; track $index; let idx = $index) {
    <app-tile
      [isMarked]="this.markedTiles().includes(idx)"
      [color]="calculateBackground(idx)"
      (click)="this.highligtedTileIdxChange.emit(idx)"
    >
      @if (tile.piece) {
        <div>
          <img
            src="pieces/{{ tile.piece.getAssetName() }}"
            alt="{{ tile.piece.getAssetName() }}"
          />
        </div>
      }
    </app-tile>
  }
</div>
